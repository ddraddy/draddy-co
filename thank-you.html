<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Thank you — Draddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@1,400&family=DM+Sans:wght@300;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 48px 24px;
    text-align: center;
    background: #f8f6f3;
    color: #1a1a1a;
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
  }
  img { height: 120px; width: auto; }
  h1 {
    font-family: 'Libre Baskerville', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(32px, 6vw, 56px);
    color: #444;
  }
  p { font-size: 16px; line-height: 1.8; color: rgba(26,26,26,0.7); max-width: 460px; }
  a {
    display: inline-block;
    padding: 14px 36px;
    background: #1a1a1a;
    color: #f8f6f3;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-decoration: none;
  }
  a:hover { background: #333; }
</style>
</head>
<body>
  <img src="logo.png" alt="Draddy.co">
  <h1>Thank you.</h1>
  <p>Your message has been received. Draddy will be in touch shortly.</p>
  <a href="/">Back to the site</a>
</body>
</html>
